# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-beaver-bsp"
BBFILE_PATTERN_meta-beaver-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-beaver-bsp = "11"

LAYERDEPENDS_meta-beaver-bsp = "core meta-arm rockchip"
LAYERSERIES_COMPAT_meta-beaver-bsp = "wrynose"

OTA_ROOTFS_SIZE ?= "3072"
