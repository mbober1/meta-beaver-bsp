#@TYPE: Machine
#@NAME: Luckfox Lyra Plus
#@DESCRIPTION: RK3506G2 based Linux Micro Development Board
#https://www.luckfox.com/Luckfox-Lyra-Plus

require conf/machine/include/rk3506.inc

IMAGE_FSTYPES = "wic wic.zst tar.zst"


KERNEL_DEVICETREE ?= "rockchip/rk3506g-luckfox-lyra-plus-sd.dtb"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
PREFERRED_PROVIDER_virtual/kernel = "linux-torvalds"

SERIAL_CONSOLES = "1500000;ttyS0"
UBOOT_MACHINE = "luckfox-lyra-rk3506_defconfig"

KERNEL_FEATURES += " \
  cfg/fs/ext4.scc \
  features/cgroups/cgroups.scc \
"

WKS_FILE = "mini_partitions.wks.in"
