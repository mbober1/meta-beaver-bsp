# Kernel configuration trim for the Luckfox Lyra Plus (RK3506G2).
#

# ---------------------------------------------------------------------------
# Box size, RAM footprint and boot time
# ---------------------------------------------------------------------------
CONFIG_CC_OPTIMIZE_FOR_SIZE=y
CONFIG_THUMB2_KERNEL=y
CONFIG_KERNEL_LZ4=y
CONFIG_MODULE_COMPRESS=y
CONFIG_MODULE_COMPRESS_XZ=y
CONFIG_DEBUG_INFO_NONE=y

# The board has well under 1 GiB of DRAM, so nothing lives above PAGE_OFFSET.
# CONFIG_HIGHMEM is not set
# CONFIG_HIGHPTE is not set
CONFIG_VMSPLIT_3G=y

# Use one serial console and do not allocate 256 legacy ptys.
# CONFIG_LEGACY_PTYS is not set

