# ---------------------------------------------------------------------------
# Board keep list - everything the RK3566 board actually needs
#
# This build uses KCONFIG_MODE=alldefconfig (from rockchip-defaults.inc), so a
# symbol that is not mentioned in any fragment falls back to its Kconfig
# default rather than to the arm64 defconfig value. Several drivers the board
# needs (THERMAL, REGULATOR, ...) default to "n", so they must be listed here
# explicitly or they silently disappear. Keep this list in sync with the board
# device tree.
# ---------------------------------------------------------------------------
CONFIG_ARCH_ROCKCHIP=y
CONFIG_ARM64=y
CONFIG_SMP=y
# CONFIG_COMPAT is not set

# Clocks, pinctrl, GPIO and reset
CONFIG_CLK_RK3568=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_ROCKCHIP=y
CONFIG_PINCTRL_RK805=y
CONFIG_GPIO_GENERIC=y
CONFIG_GPIO_ROCKCHIP=y
CONFIG_RESET_CONTROLLER=y

# Interrupts, timers, DMA and IOMMU
CONFIG_ARM_GIC=y
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_PSCI_FW=y
CONFIG_DMADEVICES=y
CONFIG_PL330_DMA=y
CONFIG_ROCKCHIP_IODOMAIN=y
CONFIG_ROCKCHIP_IOMMU=y

# PMIC, regulators, thermal, watchdog, reboot
CONFIG_MFD_CORE=y
CONFIG_MFD_RK8XX=y
CONFIG_MFD_RK8XX_I2C=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_RK808=y
CONFIG_REGULATOR_FAN53555=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_ROCKCHIP_THERMAL=y
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_DW_WATCHDOG=y
CONFIG_POWER_RESET=y
CONFIG_SYSCON_REBOOT_MODE=y
CONFIG_MFD_SYSCON=y
CONFIG_REGMAP_MMIO=y
CONFIG_REGMAP_I2C=y

# CPU frequency / OPP
CONFIG_PM=y
CONFIG_PM_GENERIC_DOMAINS=y
CONFIG_PM_GENERIC_DOMAINS_OF=y
CONFIG_PM_DEVFREQ=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPUFREQ_DT=y

# Storage: SD card via dw_mmc
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_PLTFM=y
CONFIG_MMC_DW_ROCKCHIP=y
# CONFIG_MMC_SDHCI is not set

# Console, I2C, SPI, PWM
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_8250_NR_UARTS=8
CONFIG_SERIAL_8250_RUNTIME_UARTS=8
CONFIG_I2C=y
CONFIG_I2C_RK3X=y
CONFIG_SPI=y
CONFIG_SPI_ROCKCHIP=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y

# Ethernet: RGMII MAC + Realtek PHY
CONFIG_NET_VENDOR_STMICRO=y
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_PHYLIB=y
CONFIG_REALTEK_PHY=y

# USB3 controller and its PHYs (dwc3 mode is set by the usb-gadgets feature)
CONFIG_USB=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_COMMON=y
CONFIG_USB_DWC3=y
CONFIG_USB_XHCI_HCD=y
CONFIG_PHY_ROCKCHIP_INNO_USB2=y
CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=y

# Display: HDMI built in, panfrost GPU as a module
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_DW_HDMI=y
CONFIG_DRM_DW_HDMI=y
CONFIG_PHY_ROCKCHIP_INNO_HDMI=y
CONFIG_DRM_PANFROST=m
CONFIG_FB=y
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# Random, NVMEM, ADC, LEDs, input
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_ROCKCHIP=y
