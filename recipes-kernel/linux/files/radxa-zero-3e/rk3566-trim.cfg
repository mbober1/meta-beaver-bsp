# Kernel configuration trim for the Radxa ZERO 3E (RK3566 / Cortex-A55).

# ---------------------------------------------------------------------------
# Size and boot-time overhead
# ---------------------------------------------------------------------------
CONFIG_DEBUG_INFO_NONE=y
# CONFIG_DEBUG_INFO is not set
# CONFIG_DEBUG_INFO_DWARF4 is not set
# CONFIG_DEBUG_INFO_DWARF5 is not set
# CONFIG_DEBUG_INFO_BTF is not set
# CONFIG_DEBUG_KERNEL is not set
CONFIG_MODULE_COMPRESS=y
CONFIG_MODULE_COMPRESS_ZSTD=y

# No 32-bit user space is shipped; this removes the compat syscall layer.
# CONFIG_COMPAT is not set
# CONFIG_COMPAT_32BIT_TIME is not set

# Keep kallsyms (oops decoding) but not every symbol.
# CONFIG_KALLSYMS_ALL is not set
# CONFIG_IKCONFIG is not set
# CONFIG_IKCONFIG_PROC is not set
# CONFIG_IKHEADERS is not set
# CONFIG_GDB_SCRIPTS is not set

# No profiling/tracing/coverage infrastructure in a production kernel.
# CONFIG_PERF_EVENTS is not set
# CONFIG_HW_PERF_EVENTS is not set
# CONFIG_PROFILING is not set
# CONFIG_FTRACE is not set
# CONFIG_FUNCTION_TRACER is not set
# CONFIG_DYNAMIC_FTRACE is not set
# CONFIG_FUNCTION_GRAPH_TRACER is not set
# CONFIG_KPROBES is not set
# CONFIG_UPROBES is not set
# CONFIG_SLUB_DEBUG is not set
# CONFIG_DEBUG_PAGEALLOC is not set
# CONFIG_KUNIT is not set
# CONFIG_GCOV_KERNEL is not set
# CONFIG_KCOV is not set
# CONFIG_SAMPLES is not set
# CONFIG_RUST is not set

# MAGIC_SYSRQ and debugfs stay: they are the only on-target recovery paths.
CONFIG_DEBUG_FS_ALLOW_ALL=y
# CONFIG_DEBUG_FS_ALLOW_NONE is not set

